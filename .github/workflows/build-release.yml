name: Build OpenChroma Executable

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies & Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-full \
            python3-pip \
            python3-pyqt6 \
            python3-evdev \
            python3-xlib \
            python3-dbus \
            libdbus-1-dev \
            pkg-config \
            build-essential

      - name: Build Standalone Executable
        run: |
          pip install pyinstaller openrgb-python --break-system-packages
          pyinstaller --name openchroma --onefile --windowed --add-data "assets:assets" openchroma

      - name: Create Release and Upload Binary
        uses: softprops/action-gh-release@v1
        with:
          files: dist/openchroma
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}